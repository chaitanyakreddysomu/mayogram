name: Build Android

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    # Credentials come from repository secrets, never from the source tree.
    # Absent secrets fall back to Telegram's public placeholders, so forks and
    # pull requests still build.
    env:
      TELEGRAM_APP_ID: ${{ secrets.TELEGRAM_APP_ID }}
      TELEGRAM_APP_HASH: ${{ secrets.TELEGRAM_APP_HASH }}

    steps:
      # The NDK build of ffmpeg/boringssl/dav1d/libvpx needs more room than the
      # runner has free by default.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk \
                      /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h /

      # submodules are mandatory: the native build does not exist without them.
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      # Versions are pinned by the project's build.gradle; keep them in step.
      - name: Install SDK packages
        run: |
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew :TMessagesProj_App:assembleAfatDebug --stacktrace

      - name: Build release APK and AAB
        run: |
          ./gradlew \
            :TMessagesProj_App:assembleAfatRelease \
            :TMessagesProj_App:bundleBundleAfatRelease --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: mayogram-debug-apk
          path: TMessagesProj_App/build/outputs/apk/afat/debug/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: mayogram-release-apk
          path: TMessagesProj_App/build/outputs/apk/afat/release/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: mayogram-release-aab
          path: TMessagesProj_App/build/outputs/bundle/**/*.aab
          if-no-files-found: error
