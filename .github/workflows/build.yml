name: Build Android

on:
  push:
    branches: [ main, master, beta ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    # Credentials come from repository secrets, never from the source tree.
    # Absent secrets fall back to Telegram's public placeholders, so forks and
    # pull requests still build.
    env:
      TELEGRAM_APP_ID: ${{ secrets.TELEGRAM_APP_ID }}
      TELEGRAM_APP_HASH: ${{ secrets.TELEGRAM_APP_HASH }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

    steps:
      # The NDK build of ffmpeg/boringssl/dav1d/libvpx needs more room than the
      # runner has free by default.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk \
                      /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h /

      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # The beta branch builds the separate "beta" build type/channel instead
      # of "release" - own applicationId, own update-check URL (version-beta.json
      # instead of version.json) - so pushing beta builds never notifies or
      # affects main/release users.
      - name: Determine channel
        id: channel
        run: |
          if [ "${{ github.ref }}" = "refs/heads/beta" ]; then
            echo "name=beta" >> "$GITHUB_OUTPUT"
            echo "gradle_task=:TMessagesProj_App:assembleAfatBeta" >> "$GITHUB_OUTPUT"
            echo "apk_dir=TMessagesProj_App/build/outputs/apk/afat/beta" >> "$GITHUB_OUTPUT"
          else
            echo "name=release" >> "$GITHUB_OUTPUT"
            echo "gradle_task=:TMessagesProj_App:assembleAfatRelease" >> "$GITHUB_OUTPUT"
            echo "apk_dir=TMessagesProj_App/build/outputs/apk/afat/release" >> "$GITHUB_OUTPUT"
          fi

      # Compiling jni/ for four ABIs is most of the build time, and it rarely
      # changes. The stripped libtmessages.49.so files are cached, keyed on the git
      # tree of jni/ (which pins every native submodule commit), the module's
      # build.gradle (CMake arguments) and the NDK version. On a hit, the build
      # packages them from TMessagesProj/jniLibs/ and CMake never runs.
      - name: Native cache key
        id: native-key
        run: |
          echo "key=native-ndk27.2.12479018-$(git rev-parse HEAD:TMessagesProj/jni)-$(git rev-parse HEAD:TMessagesProj/build.gradle)" >> "$GITHUB_OUTPUT"

      - name: Restore native libraries
        id: native-cache
        uses: actions/cache/restore@v4
        with:
          path: TMessagesProj/jniLibs
          key: ${{ steps.native-key.outputs.key }}

      # Submodules are fetched separately rather than by actions/checkout.
      # checkout fetches them shallowly, and chromium.googlesource.com (libyuv)
      # serves Gitiles, which refuses `fetch <sha>` for a non-tip commit, so a
      # shallow submodule fetch fails with "nonexistent object". A full fetch
      # works. Retried because these hosts are occasionally flaky.
      # With cached native libraries only the Java-side submodules are needed.
      - name: Fetch submodules
        env:
          NATIVE_CACHED: ${{ steps.native-cache.outputs.cache-hit }}
        run: |
          if [ "$NATIVE_CACHED" = "true" ]; then
            paths="TMessagesProj/lib/jlatexmath TMessagesProj_Modules/media"
          else
            paths=""
          fi
          for i in 1 2 3; do
            git submodule sync --recursive
            git submodule update --init --recursive $paths && exit 0
            echo "submodule fetch failed (attempt $i), retrying..."
            sleep 15
          done
          exit 1

      # Downloads the Temurin JDK from Adoptium's GitHub release assets,
      # which occasionally 504s (same kind of flaky-host issue as the
      # submodule fetch above, retried for the same reason). setup-java
      # already retries its own download internally; this adds whole-step
      # retries on top for when that still isn't enough.
      - uses: actions/setup-java@v4
        id: setup-java-1
        continue-on-error: true
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-java@v4
        id: setup-java-2
        if: steps.setup-java-1.outcome == 'failure'
        continue-on-error: true
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-java@v4
        if: steps.setup-java-1.outcome == 'failure' && steps.setup-java-2.outcome == 'failure'
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          # Default is "tools platform-tools"; the obsolete `tools` package no
          # longer exists in the SDK repository and fails the install.
          packages: platform-tools

      # Versions are pinned by the project's build.gradle; keep them in step.
      - name: Install SDK packages
        run: |
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v4

      # Signing key comes from a secret, never from the repository. Without it
      # the build falls back to the committed dummy keystore, so forks still build.
      - name: Decode signing keystore
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > TMessagesProj/config/mayogram.keystore
          {
            echo "ORG_GRADLE_PROJECT_RELEASE_STORE_FILE=mayogram.keystore"
            echo "ORG_GRADLE_PROJECT_RELEASE_KEY_ALIAS=mayogram"
            echo "ORG_GRADLE_PROJECT_RELEASE_STORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}"
            echo "ORG_GRADLE_PROJECT_RELEASE_KEY_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}"
          } >> "$GITHUB_ENV"

      # Beta builds get their own version string/code each run, computed from
      # BETA_VERSION_NAME/BETA_VERSION_CODE (independent of the release
      # version) plus a run number - this file change is never committed, so
      # it doesn't affect the real release version. The sed'd gradle.properties
      # only exists in this job's workspace for the duration of the build.
      - name: Bump beta version
        if: steps.channel.outputs.name == 'beta'
        id: beta-version
        run: |
          baseName=$(grep '^BETA_VERSION_NAME=' gradle.properties | cut -d= -f2)
          baseCode=$(grep '^BETA_VERSION_CODE=' gradle.properties | cut -d= -f2)
          betaName="${baseName}-beta.${{ github.run_number }}"
          betaCode=$((baseCode * 100000 + ${{ github.run_number }}))
          sed -i "s/^APP_VERSION_NAME=.*/APP_VERSION_NAME=${betaName}/" gradle.properties
          sed -i "s/^APP_VERSION_CODE=.*/APP_VERSION_CODE=${betaCode}/" gradle.properties
          echo "version=$betaName" >> "$GITHUB_OUTPUT"

      - name: Build APK
        run: |
          ./gradlew \
            ${{ steps.channel.outputs.gradle_task }} --stacktrace

      # Best effort: a failure here only means the next run builds natively again.
      - name: Collect native libraries for cache
        id: native-collect
        if: steps.native-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        run: |
          strip="$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            src=$(find TMessagesProj/build/intermediates/cxx -path "*/$abi/libtmessages.49.so" | head -n 1)
            if [ -z "$src" ]; then
              echo "no libtmessages.49.so built for $abi" >&2
              exit 1
            fi
            mkdir -p "TMessagesProj/jniLibs/$abi"
            "$strip" --strip-unneeded -o "TMessagesProj/jniLibs/$abi/libtmessages.49.so" "$src"
          done
          ls -la TMessagesProj/jniLibs/*

      - name: Save native libraries
        if: steps.native-cache.outputs.cache-hit != 'true' && steps.native-collect.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: TMessagesProj/jniLibs
          key: ${{ steps.native-key.outputs.key }}

      - uses: actions/upload-artifact@v4
        with:
          name: mayogram-${{ steps.channel.outputs.name }}-apk
          path: ${{ steps.channel.outputs.apk_dir }}/*.apk
          if-no-files-found: error

      # Auto-publish a GitHub Release for every build on main/master, tagged
      # from gradle.properties' APP_VERSION_NAME. version.json's downloadUrl
      # expects the asset to be named app.apk, so it's copied to that name
      # before upload. Skipped for pull requests - those just keep the
      # workflow artifact above. Beta pushes use the separate steps below
      # instead, so they never touch version.json or the v* release tags.
      - name: Read app version
        if: steps.channel.outputs.name == 'release' && github.event_name != 'pull_request'
        id: app-version
        run: |
          version=$(grep '^APP_VERSION_NAME=' gradle.properties | cut -d= -f2)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Prepare release APK
        if: steps.channel.outputs.name == 'release' && github.event_name != 'pull_request'
        run: |
          apk=$(find TMessagesProj_App/build/outputs/apk/afat/release -name '*.apk' | head -n 1)
          cp "$apk" app.apk

      - name: Create GitHub Release
        if: steps.channel.outputs.name == 'release' && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.app-version.outputs.version }}
          name: v${{ steps.app-version.outputs.version }}
          generate_release_notes: true
          files: app.apk

      # Beta channel: published as a pre-release (never shows as "Latest"),
      # and version-beta.json is rewritten and pushed straight back to the
      # beta branch so every push notifies beta testers automatically. This
      # push is authenticated with the default GITHUB_TOKEN, which GitHub
      # never uses to re-trigger push-triggered workflows, so it can't loop.
      - name: Prepare beta APK
        if: steps.channel.outputs.name == 'beta' && github.event_name != 'pull_request'
        run: |
          apk=$(find ${{ steps.channel.outputs.apk_dir }} -name '*.apk' | head -n 1)
          cp "$apk" app-beta.apk

      - name: Create GitHub beta pre-release
        if: steps.channel.outputs.name == 'beta' && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: beta-v${{ steps.beta-version.outputs.version }}
          name: Beta v${{ steps.beta-version.outputs.version }}
          prerelease: true
          generate_release_notes: true
          files: app-beta.apk

      - name: Update version-beta.json
        if: steps.channel.outputs.name == 'beta' && github.event_name != 'pull_request'
        run: |
          cat > version-beta.json <<EOF
          {
            "latestVersion": "${{ steps.beta-version.outputs.version }}",
            "downloadUrl": "https://github.com/${{ github.repository }}/releases/download/beta-v${{ steps.beta-version.outputs.version }}/app-beta.apk",
            "changelog": "Beta build from commit ${{ github.sha }}",
            "features": []
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version-beta.json
          git commit -m "Update version-beta.json for beta v${{ steps.beta-version.outputs.version }}"
          git push origin beta || (git pull --rebase origin beta && git push origin beta)
