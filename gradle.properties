## Project-wide Gradle settings.
#
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
#
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# Default value: -Xmx10248m -XX:MaxPermSize=256m
# org.gradle.jvmargs=-Xmx2048m -XX:MaxPermSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
#
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
# org.gradle.parallel=true
#Sat Mar 12 05:53:50 MSK 2016
APP_VERSION_CODE=2
APP_VERSION_NAME=1.3
APP_PACKAGE=com.mayogram.messenger
IS_PRIVATE=false
# Signing. Override these in ~/.gradle/gradle.properties (local) or via
# ORG_GRADLE_PROJECT_* environment variables (CI) to sign with a private
# key. The committed release.keystore is Telegram's public dummy key and
# must not be used for anything you distribute.
RELEASE_STORE_FILE=release.keystore
RELEASE_KEY_PASSWORD=android
RELEASE_KEY_ALIAS=androidkey
RELEASE_STORE_PASSWORD=android
org.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=1g
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.configureondemand=false
org.gradle.caching=true
android.useAndroidX=true
android.enableJetifier=true
android.defaults.buildfeatures.buildconfig=true
android.enableR8.fullMode=true
android.r8.optimizedResourceShrinking=true
android.enableResourceOptimizations=true
org.gradle.tooling.parallel=true

# When deploying a debug build from Android Studio to a connected device or
# emulator, only compile native (jni/) code for that device's ABI instead of
# all 4 (armeabi-v7a/arm64-v8a/x86/x86_64). Cuts native (TDLib/BoringSSL/
# ffmpeg/WebRTC/etc.) build time roughly 4x for local dev. Does NOT affect
# assembleRelease/bundleRelease, which still build every ABI for distribution.
# For command-line builds, get the same effect with:
#   ./gradlew assembleAfatDebug -Pandroid.injected.build.abi=arm64-v8a
android.buildOnlyTargetAbi=true
